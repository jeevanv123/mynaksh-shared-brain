services:
  neo4j:
    image: neo4j:5
    container_name: mynaksh-neo4j
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '[]'
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: mynaksh-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GRAPH_STORE: neo4j
      NEO4J_URI: bolt://neo4j:7687
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
